[package]
name = "git-chronicle"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Analyze Git history and import graphs to see architecture evolve"
repository = "https://github.com/gautam247gk/git-chronicles"
readme = "README.md"
rust-version = "1.88"
keywords = ["git", "dependencies", "visualization", "architecture"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
